<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Universal Dark Mode Regression Tests</title>
    <style>
        body { margin: 0; background: rgb(43, 43, 59); }
        body > div { min-width: 1272px; }
        #login { position: fixed; inset: 0; background: white; color: black; padding: 24px; }
        #existing-dark { background: rgb(30, 35, 40); color: white; }
        #login label::after { content: '.example.com'; color: rgb(6, 6, 45); }
        #login input::placeholder { color: rgb(69, 69, 161); }
        iframe, embed, object { width: 160px; height: 100px; }
        #results { position: fixed; bottom: 80px; left: 24px; max-width: 80vw; white-space: pre-wrap; }
    </style>
</head>
<body>
    <main id="login">
        <h1>Login fixture</h1>
        <label>Company <input type="text" placeholder="company"></label>
        <button type="button">Continue</button>
        <p id="existing-dark">Existing dark surface</p>
        <img id="product-image" alt="Product fixture" width="32" height="32" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+aP1sAAAAASUVORK5CYII=">
        <iframe title="Embedded page" srcdoc="<p>Embedded page</p>"></iframe>
        <embed type="application/pdf" aria-label="PDF embed">
        <object type="application/pdf" aria-label="PDF object"><p>PDF fallback</p></object>
    </main>
    <pre id="results">Running...</pre>
    <script>
        let toggleDarkMode;
        let toggleImageBlending;
        let toggleMethod;
        let savedPreference;
        const preferences = new Map();
        const preferenceListeners = new Map();
        let styleReads = 0;
        const originalGetComputedStyle = window.getComputedStyle.bind(window);
        window.getComputedStyle = (...args) => {
            styleReads++;
            return originalGetComputedStyle(...args);
        };
        window.requestAnimationFrame = (callback) => setTimeout(() => callback(performance.now()), 0);
        window.GM_addStyle = (css) => {
            const style = document.createElement('style');
            style.textContent = css;
            document.head.append(style);
        };
        window.GM_getValue = (key, fallback) => preferences.has(key) ? preferences.get(key) : fallback;
        window.GM_setValue = (key, value) => {
            preferences.set(key, value);
            if (key.startsWith('universal-dark-mode-enabled:')) savedPreference = value;
        };
        window.GM_addValueChangeListener = (key, callback) => preferenceListeners.set(key, callback);
        window.GM_registerMenuCommand = (label, callback) => {
            if (label === 'Toggle universal dark mode') toggleDarkMode = callback;
            else if (label.startsWith('Switch dark mode method')) toggleMethod = callback;
            else toggleImageBlending = callback;
        };
    </script>
    <script src="../UniversalDarkMode.user.js"></script>
    <script>
        const nextFrame = () => new Promise((resolve) => requestAnimationFrame(resolve));
        const settle = async () => {
            await nextFrame();
            await new Promise((resolve) => setTimeout(resolve, 120));
        };
        const assert = (condition, message) => { if (!condition) throw new Error(message); };
        const login = document.getElementById('login');
        const original = {
            rect: JSON.stringify(login.getBoundingClientRect().toJSON()),
            background: getComputedStyle(login).backgroundColor,
            colour: getComputedStyle(login).color,
            width: document.documentElement.scrollWidth,
        };
        const runTests = async () => {
            assert(document.body.offsetHeight === 0, 'Fixture must reproduce a zero-height body');
            assert(document.documentElement.classList.contains('tm-universal-dark-mode-filters'), 'Default method is not filters');
            toggleMethod();
            assert(!document.documentElement.classList.contains('tm-universal-dark-mode'), 'Method switch enabled dark mode');
            assert(preferences.get(`universal-dark-mode-method:${location.hostname}`) === 'colours', 'Method was not saved per site');
            toggleDarkMode();
            await settle();
            assert(savedPreference === true, 'Enabled preference was not saved');
            assert(JSON.stringify(login.getBoundingClientRect().toJSON()) === original.rect, 'Fixed panel moved');
            assert(document.documentElement.scrollWidth === original.width, 'Page width changed');
            assert(getComputedStyle(login).backgroundColor !== original.background, 'Light background did not darken');
            assert(getComputedStyle(login).backgroundColor === 'rgb(25, 27, 28)', 'Surface is not the darker palette');
            const image = document.getElementById('product-image');
            assert(getComputedStyle(image).filter === 'none', 'Image background removal must be opt-in');
            const imageReads = styleReads;
            toggleImageBlending();
            await settle();
            assert(styleReads === imageReads, 'Image blending triggered a colour scan');
            assert(getComputedStyle(image).filter.includes('tm-universal-dark-mode-white-key'), 'Image background removal did not enable');
            assert(getComputedStyle(login).color !== original.colour, 'Dark text did not lighten');
            assert(getComputedStyle(document.querySelector('label'), '::after').color !== 'rgb(6, 6, 45)', 'Generated text did not lighten');
            assert(getComputedStyle(document.querySelector('input'), '::placeholder').color !== 'rgb(69, 69, 161)', 'Placeholder did not lighten');
            assert(getComputedStyle(document.getElementById('existing-dark')).backgroundColor === 'rgb(30, 35, 40)', 'Existing dark surface changed');
            assert(document.elementFromPoint(30, 30) === login, 'Fixed panel became obscured');
            const host = document.getElementById('tm-universal-dark-mode-toggle');
            assert(host.getBoundingClientRect().width === Math.min(144, innerWidth), 'Site CSS stretched the toggle');
            for (const viewer of document.querySelectorAll('iframe, embed, object')) {
                for (let ancestor = viewer; ancestor; ancestor = ancestor.parentElement) {
                    assert(getComputedStyle(ancestor).filter === 'none', 'Viewer has a filtered ancestor');
                }
                assert(!viewer.hasAttribute('data-tm-universal-dark-mode-surface'), 'Viewer was recoloured');
            }
            assert(!document.querySelector('object p').hasAttribute('data-tm-universal-dark-mode-surface'), 'Viewer fallback was recoloured');
            const dynamic = document.createElement('p');
            dynamic.style.cssText = 'background-color:rgb(250,250,250);color:rgb(10,10,10)';
            login.append(dynamic);
            await Promise.resolve();
            assert(getComputedStyle(dynamic).backgroundColor !== 'rgb(250, 250, 250)', 'Inserted surface flashed white before the debounce');
            await settle();
            assert(getComputedStyle(dynamic).backgroundColor !== 'rgb(250, 250, 250)', 'Dynamic surface was not themed');
            dynamic.style.backgroundColor = 'rgb(220, 230, 240)';
            await settle();
            const textReads = styleReads;
            for (let index = 0; index < 100; index++) dynamic.textContent = `Text update ${index}`;
            await settle();
            assert(styleReads === textReads, 'Text-only updates triggered style reads');
            const localReads = styleReads;
            dynamic.style.color = 'rgb(20, 20, 20)';
            await settle();
            assert(styleReads - localReads <= 4, 'Local update scanned unrelated elements');
            assert(styleReads > localReads, 'Local update was not processed');
            const rulesBefore = [...document.querySelectorAll('style')].map((style) => style.textContent).join('');
            await settle();
            const rulesAfter = [...document.querySelectorAll('style')].map((style) => style.textContent).join('');
            assert(rulesBefore === rulesAfter, 'Repeated updates changed the colours');
            toggleDarkMode();
            await settle();
            assert(savedPreference === false, 'Disabled preference was not saved');
            assert(getComputedStyle(image).filter === 'none', 'Image background removal remained active in light mode');
            assert(getComputedStyle(login).backgroundColor === original.background, 'Background was not restored');
            assert(getComputedStyle(login).color === original.colour, 'Text was not restored');
            assert(getComputedStyle(dynamic).backgroundColor === 'rgb(220, 230, 240)', 'Page changes were not preserved');
            login.style.setProperty('position', 'static', 'important');
            document.getElementById('results').style.setProperty('position', 'static', 'important');
            for (const viewer of document.querySelectorAll('iframe, embed, object')) viewer.remove();
            toggleMethod();
            assert(preferences.get(`universal-dark-mode-method:${location.hostname}`) === 'filters', 'Filter method was not saved');
            assert(savedPreference === false, 'Method switch changed enabled preference');
            toggleDarkMode();
            await settle();
            assert(document.documentElement.classList.contains('tm-universal-dark-mode-filters'), 'Safe page did not use filters');
            assert(getComputedStyle(document.documentElement).filter.includes('invert(1)'), 'Root inversion was not restored');
            const fixed = document.createElement('div');
            fixed.style.position = 'fixed';
            document.body.append(fixed);
            await Promise.resolve();
            assert(getComputedStyle(document.documentElement).filter.includes('invert(1)'), 'Fixed insertion automatically changed method');
            fixed.remove();
            await settle();
            assert(getComputedStyle(document.documentElement).filter.includes('invert(1)'), 'Removing fixed element did not restore filters');
            const viewer = document.createElement('embed');
            viewer.type = 'application/pdf';
            document.body.append(viewer);
            await Promise.resolve();
            assert(getComputedStyle(document.documentElement).filter.includes('invert(1)'), 'PDF insertion automatically changed method');
            toggleMethod();
            assert(getComputedStyle(document.documentElement).filter === 'none', 'Manual colour selection did not remove root filter');
            assert(savedPreference === true, 'Method switch disabled dark mode');
            viewer.remove();
            await settle();
            assert(getComputedStyle(document.documentElement).filter === 'none', 'Removing viewer automatically changed method');
            const methodKey = `universal-dark-mode-method:${location.hostname}`;
            preferenceListeners.get(methodKey)(methodKey, 'colours', 'filters');
            assert(getComputedStyle(document.documentElement).filter.includes('invert(1)'), 'Cross-tab method selection was not applied');
            toggleDarkMode();
            assert(getComputedStyle(document.documentElement).filter === 'none', 'Disabling filter mode did not restore original filter');
            return 'Passed: fixed layout, viewport width, colours, media exclusions, dynamic updates, and restoration.';
        };
        window.testResult = runTests().then((message) => {
            document.getElementById('results').textContent = message;
            return { passed: true, message };
        }).catch((error) => {
            document.getElementById('results').textContent = `Failed: ${error.message}`;
            return { passed: false, message: error.message };
        });
    </script>
</body>
</html>
